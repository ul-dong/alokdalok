<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="만 3세 유아용 숫자·색깔 놀이">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    /* 아이폰 노치·둥근 모서리·홈 인디케이터 아래로 앱이 들어가지 않게, Flutter를 안전 영역 안의 #app-host 에 띄운다.
       (Flutter 웹은 안전 영역을 MediaQuery.padding 으로 넘겨주지 않는다.)
       여백은 앱 첫 화면과 같은 하늘색으로 채운다. --sa-* 는 ?safeArea= 시험 모드에서만 덮어쓴다. */
    :root {
      --sa-top: env(safe-area-inset-top, 0px);
      --sa-right: env(safe-area-inset-right, 0px);
      --sa-bottom: env(safe-area-inset-bottom, 0px);
      --sa-left: env(safe-area-inset-left, 0px);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #e6f4fc;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* top·bottom 을 함께 걸어서, 사파리 주소창이 나타나거나 사라져 보이는 높이가 바뀌어도 따라 줄고 는다 */
    #app-host {
      position: fixed;
      top: var(--sa-top);
      right: var(--sa-right);
      bottom: var(--sa-bottom);
      left: var(--sa-left);
      overflow: hidden;
      background: #e6f4fc;
      touch-action: none;
    }
    html.safe-area-test, html.safe-area-test body {
      background: repeating-linear-gradient(45deg, #f6c1c1 0 10px, #fbe3e3 10px 20px);
    }
  </style>
  <script>
    // 시험 모드: ?safeArea=위,오른쪽,아래,왼쪽 (px) 로 가짜 안전 영역을 준다. 쿼리가 있을 때만 동작한다.
    (function () {
      var m = /[?&]safeArea=([0-9.]+),([0-9.]+),([0-9.]+),([0-9.]+)/.exec(location.search);
      if (!m) return;
      var r = document.documentElement;
      r.classList.add('safe-area-test');
      ['top', 'right', 'bottom', 'left'].forEach(function (side, i) {
        r.style.setProperty('--sa-' + side, m[i + 1] + 'px');
      });
    })();
  </script>
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="알록달록">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>알록달록 꼬마 놀이터</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="app-host"></div>
  <script src="eye_guard.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
